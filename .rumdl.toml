[global]
# Generated by Hexlet.
exclude = [".github/workflows/README.md"]
# Apply exclude to files passed explicitly too (hk passes staged files).
force_exclude = true
line_length = 120

[MD033]
# The collapsible section from the Hexlet README template.
allowed-elements = ["details", "summary"]

[per-file-ignores]
# Written by release-please, which puts two blank lines before each section; see AGENTS.md.
"CHANGELOG.md" = ["MD012"]
