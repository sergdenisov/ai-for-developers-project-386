min_version = "2026.10.17"

[settings]
# Required for [daemons].
experimental = true

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
# Dev server ports; keep in sync with ready_port of the daemons below.
BACKEND_PORT = "3000"
FRONTEND_PORT = "5173"

[tools]
betterleaks = "1.9.0"
"github:agent-sh/agnix" = "0.59.3"
hk = { version = "2.9.0", workflow = "release.yml" }
jactionlint = { version = "2.3.0", workflow = "release.yaml" }
lychee = "0.24.2"
node = "24.18.0"
osv-scanner = "2.7.0"
pitchfork = "2.32.3"
pkl = "0.32.2"
rumdl = "0.3.1"
shellcheck = "0.11.0"
typos = "1.51.1"

[hooks]
# `mise install` also installs npm dependencies and git hooks.
postinstall = { task = "install" }

[tasks.install]
description = "Install npm dependencies of every package, Chromium for the browser tests and git hooks"
run = [
  "npm ci",
  "npm ci --prefix spec",
  "npm ci --prefix backend",
  "npm ci --prefix frontend",
  "npm exec --prefix frontend -- playwright install chromium",
  "hk install --mise",
]

# Contract chain: spec/main.tsp -> spec/openapi.yaml -> frontend SDK and backend types (docs/adr/0003).
[tasks.generate]
description = "Compile the TypeSpec contract to OpenAPI, then generate the frontend SDK and backend types from it"
run = "npm run generate --prefix spec"

[tasks."dev:backend"]
description = "Backend dev server with reload on change"
dir = "backend"
env = { PORT = "{{env.BACKEND_PORT}}", HOST = "127.0.0.1" }
run = "npm run dev"

[tasks."dev:frontend"]
description = "Frontend dev server (Vite)"
dir = "frontend"
# Bind to IPv4: on macOS `localhost` is ::1, and the daemon's ready_port check would never pass.
run = "npm run dev -- --host 127.0.0.1 --port {{env.FRONTEND_PORT}} --strictPort"

[tasks.dev]
description = "Start backend and frontend dev servers in the background; stop with `mise daemons stop`"
daemons = true
run = "mise daemons ls"

[tasks.build]
description = "Build backend and frontend"
# `check:contract` rewrites the generated code; when both run, they must not overlap.
wait_for = ["check:contract"]
run = ["npm run build --prefix backend", "npm run build --prefix frontend"]

[tasks.start]
description = "Run the built backend"
dir = "backend"
depends = ["build"]
env = { PORT = "{{env.BACKEND_PORT}}" }
run = "npm start"

[tasks."check:hk"]
description = "Linters and formatters (the same steps as the git hooks)"
wait_for = ["check:contract"]
run = "hk check --all"

[tasks."check:secrets"]
description = "Scan the git history for committed secrets"
run = "betterleaks git --redact --no-banner"

# lychee skips frontend/index.html: its root-relative paths (/favicon.svg) are served by Vite from frontend/public.
[tasks."check:network"]
description = "Checks that need the network: known vulnerabilities in lockfiles, broken links"
run = ["osv-scanner scan source -r .", "lychee --no-progress --exclude-path frontend/index.html ."]

[tasks."check:contract"]
description = "Fail if the committed OpenAPI, SDK or backend types differ from what the contract generates"
depends = ["generate"]
run = """
paths='spec/openapi.yaml backend/src/api/generated frontend/src/api/generated'
# --porcelain also lists new untracked files, which `git diff` misses.
changes=$(git status --porcelain -- $paths)
if [ -n "$changes" ]; then
  echo "$changes"
  git diff -- $paths
  echo 'Generated files are out of date: run `mise run generate` and commit the result.' >&2
  exit 1
fi
"""

[tasks."check:types"]
description = "Type-check backend and frontend"
wait_for = ["check:contract"]
run = ["npm run typecheck --prefix backend", "npm run typecheck --prefix frontend"]

[tasks."check:unused"]
description = "Find unused files, exports and dependencies"
wait_for = ["check:contract"]
run = ["knip", "knip --directory spec", "knip --directory backend", "knip --directory frontend"]

[tasks."check:test"]
description = "Run tests"
wait_for = ["check:contract"]
run = ["npm test --prefix backend", "npm test --prefix frontend"]

# Not in `check:project`, so the pre-push hook does not run it; `check` and CI do.
[tasks."check:e2e"]
description = "Browser scenarios (Playwright, Chromium) against the built backend and `vite preview`"
depends = ["build"]
run = "npm run test:e2e --prefix frontend"

[tasks."check:project"]
description = "Whole-project checks: generated contract code, types, unused code, tests"
depends = ["check:contract", "check:types", "check:unused", "check:test"]

[tasks.check]
description = "Run every check (CI runs the same command)"
depends = ["check:hk", "check:secrets", "check:network", "check:project", "check:e2e"]

[tasks.fix]
description = "Apply safe autofixes"
run = "hk fix --all"

# Dev servers supervised by pitchfork: mise daemons start | stop | status | logs.
[daemons.backend]
task = "dev:backend"
ready_port = 3000

[daemons.frontend]
task = "dev:frontend"
ready_port = 5173
depends = ["backend"]
