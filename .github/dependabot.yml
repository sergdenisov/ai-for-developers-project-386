version: 2

updates:
  - package-ecosystem: npm
    directories: ['/', '/spec', '/backend', '/frontend']
    schedule:
      interval: weekly
    # Skip freshly published versions: compromised releases are usually caught within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      # 0.x with breaking changes in minor versions, pinned to an exact version: update it on its own and
      # regenerate the SDK and backend types (`mise run generate`).
      hey-api:
        patterns: ['@hey-api/openapi-ts']
      npm-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['@hey-api/openapi-ts']
    ignore:
      # The major version of @types/node follows Node.js in mise.toml; bump both together by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    # Generated by Hexlet; the course forbids editing it.
    exclude-paths: ['.github/workflows/hexlet-check.yml']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
