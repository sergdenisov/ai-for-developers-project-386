version: 2

updates:
  - package-ecosystem: npm
    directories: ['/', '/backend', '/frontend']
    schedule:
      interval: weekly
    # Skip freshly published versions: compromised releases are usually caught within days.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    # Generated by Hexlet; the course forbids editing it.
    exclude-paths: ['.github/workflows/hexlet-check.yml']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
