name: scheduled

# Vulnerability databases and linked pages change without any commit here.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Skip the postinstall hook (`mise run install`): network checks need no npm dependencies.
  MISE_NO_HOOKS: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.21

      - run: mise run check:network
        env:
          # lychee uses it to avoid GitHub rate limits on links.
          GITHUB_TOKEN: ${{ github.token }}
